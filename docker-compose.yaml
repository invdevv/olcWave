services:
  caddy:
    image: caddy:2
    container_name: olcwave-caddy
    restart: always

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ./frontend/dist:/srv/frontend/dist:ro
      - ./subscriptionPage/dist:/srv/subscriptionPage/dist:ro

    networks:
      - app

    depends_on:
      - api

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: olcwave-api
    restart: always

    env_file:
      - ./backend/.env

    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
      # token vault sidecar (see vault/); the secret comes from the compose project's .env
      VAULT_URL: http://vault:8091
      VAULT_SECRET: ${VAULT_SECRET:-}

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

    networks:
      - app

    depends_on:
      postgres:
        condition: service_healthy

  vault:
    build:
      context: ./vault
      dockerfile: Dockerfile

    image: olcwave-vault
    container_name: olcwave-vault
    restart: always
    # tini reaps Chromium's exiting helper processes; without it they pile up as zombies
    init: true

    environment:
      VAULT_SECRET: ${VAULT_SECRET:-}
      PORT: "8091"
      ACCOUNTS_DIR: /data/accounts

    volumes:
      # seeded browser sessions - each one is a live login to a Yandex account
      - vault_data:/data

    networks:
      - app

  postgres:
    image: postgres:16-alpine

    container_name: olcwave-postgres
    restart: always

    env_file:
      - ./backend/.env

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - app

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  app:

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  vault_data:
